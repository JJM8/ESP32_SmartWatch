<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'SF Mono','JetBrains Mono','Consolas',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00cc7a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00ff9d"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#f4f4f5" font-size="16" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
  <line x1="180" y1="46" x2="720" y2="46" stroke="#1a1a2e" stroke-width="1"/>

  <!-- ===== LAYER 1: HARDWARE (bottom) ===== -->
  <rect x="40" y="400" width="820" height="100" rx="10" fill="#0f0f1a" stroke="#1a1a2e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="400" width="3" height="100" fill="url(#orange)" rx="2"/>
  <text x="60" y="420" fill="#f97316" font-size="10" font-weight="700" letter-spacing="1">HARDWARE LAYER</text>

  <!-- ESP32 -->
  <rect x="70" y="432" width="140" height="52" rx="6" fill="#1a1a2e" stroke="#f97316" stroke-width="1" opacity="0.9"/>
  <text x="140" y="452" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">ESP32-WROOM-32E</text>
  <text x="140" y="468" text-anchor="middle" fill="#71717a" font-size="9">Dual-core 240 MHz · 16 MB Flash</text>

  <!-- Peripherals cluster -->
  <rect x="240" y="432" width="110" height="52" rx="6" fill="#1a1a2e" stroke="#f97316" stroke-width="1" opacity="0.9"/>
  <text x="295" y="452" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">ILI9341 TFT</text>
  <text x="295" y="468" text-anchor="middle" fill="#71717a" font-size="9">320×240 · Touch</text>

  <rect x="375" y="432" width="110" height="52" rx="6" fill="#1a1a2e" stroke="#f97316" stroke-width="1" opacity="0.9"/>
  <text x="430" y="452" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">I²S Microphone</text>
  <text x="430" y="468" text-anchor="middle" fill="#71717a" font-size="9">Voice Input</text>

  <rect x="510" y="432" width="110" height="52" rx="6" fill="#1a1a2e" stroke="#f97316" stroke-width="1" opacity="0.9"/>
  <text x="565" y="452" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">WiFi + BLE</text>
  <text x="565" y="468" text-anchor="middle" fill="#71717a" font-size="9">802.11 b/g/n · BLE 4.2</text>

  <rect x="645" y="432" width="110" height="52" rx="6" fill="#1a1a2e" stroke="#f97316" stroke-width="1" opacity="0.9"/>
  <text x="700" y="452" text-anchor="middle" fill="#f4f4f5" font-size="11" font-weight="700">LiPo Battery</text>
  <text x="700" y="468" text-anchor="middle" fill="#71717a" font-size="9">Deep Sleep</text>

  <!-- ===== LAYER 2: FIRMWARE ===== -->
  <rect x="40" y="250" width="820" height="130" rx="10" fill="#0f0f1a" stroke="#1a1a2e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="250" width="3" height="130" fill="url(#blue)" rx="2"/>
  <text x="60" y="270" fill="#3b82f6" font-size="10" font-weight="700" letter-spacing="1">FIRMWARE LAYER</text>

  <!-- Apps row -->
  <rect x="70" y="282" width="110" height="36" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="125" y="300" text-anchor="middle" fill="#f4f4f5" font-size="10" font-weight="500">Clock / Timetable</text>
  <text x="125" y="312" text-anchor="middle" fill="#52525b" font-size="8">Home Screen</text>

  <rect x="200" y="282" width="110" height="36" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="255" y="300" text-anchor="middle" fill="#f4f4f5" font-size="10" font-weight="500">Drawing</text>
  <text x="255" y="312" text-anchor="middle" fill="#52525b" font-size="8">Touch Paint</text>

  <rect x="330" y="282" width="110" height="36" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="385" y="300" text-anchor="middle" fill="#f4f4f5" font-size="10" font-weight="500">Weather</text>
  <text x="385" y="312" text-anchor="middle" fill="#52525b" font-size="8">OpenWeatherMap</text>

  <rect x="460" y="282" width="110" height="36" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="515" y="300" text-anchor="middle" fill="#f4f4f5" font-size="10" font-weight="500">Snooker</text>
  <text x="515" y="312" text-anchor="middle" fill="#52525b" font-size="8">2D Physics</text>

  <!-- Audio pipeline -->
  <rect x="70" y="332" width="245" height="36" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2" opacity="0.9"/>
  <text x="192" y="350" text-anchor="middle" fill="#f4f4f5" font-size="10" font-weight="500">Audio Capture Pipeline</text>
  <text x="192" y="362" text-anchor="middle" fill="#52525b" font-size="8">I²S → Buffer → WiFi Stream</text>

  <!-- Agent client -->
  <rect x="460" y="332" width="245" height="36" rx="6" fill="#1a1a2e" stroke="#00ff9d" stroke-width="1.5" opacity="0.9"/>
  <text x="582" y="350" text-anchor="middle" fill="#00ff9d" font-size="10" font-weight="700">Uniagent Client</text>
  <text x="582" y="362" text-anchor="middle" fill="#52525b" font-size="8">HTTP / WebSocket Bridge</text>

  <!-- ===== LAYER 3: AGENT (top) ===== -->
  <rect x="40" y="70" width="820" height="160" rx="10" fill="#0f0f1a" stroke="#1a1a2e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="70" width="3" height="160" fill="url(#accent)" rx="2"/>
  <text x="60" y="90" fill="#00ff9d" font-size="10" font-weight="700" letter-spacing="1">AGENT LAYER — UNIAGENT</text>

  <!-- Speech -->
  <rect x="70" y="104" width="175" height="48" rx="6" fill="#1a1a2e" stroke="#00ff9d" stroke-width="1" opacity="0.9"/>
  <text x="157" y="124" text-anchor="middle" fill="#00ff9d" font-size="11" font-weight="700">Speech-to-Text</text>
  <text x="157" y="140" text-anchor="middle" fill="#71717a" font-size="9">Whisper / Local ASR</text>

  <!-- LLM -->
  <rect x="275" y="104" width="175" height="48" rx="6" fill="#1a1a2e" stroke="#00ff9d" stroke-width="1" opacity="0.9"/>
  <text x="362" y="124" text-anchor="middle" fill="#00ff9d" font-size="11" font-weight="700">LLM Reasoning</text>
  <text x="362" y="140" text-anchor="middle" fill="#71717a" font-size="9">Claude / GPT / Local</text>

  <!-- Tools -->
  <rect x="480" y="104" width="175" height="48" rx="6" fill="#1a1a2e" stroke="#00ff9d" stroke-width="1" opacity="0.9"/>
  <text x="567" y="124" text-anchor="middle" fill="#00ff9d" font-size="11" font-weight="700">Tool Execution</text>
  <text x="567" y="140" text-anchor="middle" fill="#71717a" font-size="9">Files · Terminal · APIs</text>

  <!-- Text-to-Speech -->
  <rect x="685" y="104" width="150" height="48" rx="6" fill="#1a1a2e" stroke="#00ff9d" stroke-width="1" opacity="0.9"/>
  <text x="760" y="124" text-anchor="middle" fill="#00ff9d" font-size="11" font-weight="700">Text-to-Speech</text>
  <text x="760" y="140" text-anchor="middle" fill="#71717a" font-size="9">Response Audio</text>

  <!-- System access row -->
  <rect x="70" y="170" width="600" height="44" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
  <text x="370" y="190" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="500">File System · Shell · Network · Smart Home · Calendar · Email</text>
  <text x="370" y="204" text-anchor="middle" fill="#52525b" font-size="8">Extensible tool system — any API or service</text>

  <!-- ===== ARROWS ===== -->

  <!-- Hardware → Firmware -->
  <line x1="295" y1="432" x2="295" y2="392" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)" opacity="0.6"/>

  <!-- Firmware (agent client) → Agent Layer -->
  <line x1="582" y1="332" x2="582" y2="238" stroke="#00ff9d" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="590" y="285" fill="#52525b" font-size="8">WiFi</text>

  <!-- Agent TTS → back to firmware -->
  <line x1="760" y1="104" x2="760" y2="72" stroke="#00ff9d" stroke-width="1" opacity="0.3"/>
  <path d="M760,72 Q760,62 750,62 L620,62" stroke="#00ff9d" stroke-width="1" fill="none" opacity="0.3"/>
  <line x1="620" y1="62" x2="620" y2="282" stroke="#00ff9d" stroke-width="1" marker-end="url(#arrow)" opacity="0.3"/>

  <!-- Legend -->
  <circle cx="680" cy="16" r="4" fill="#00ff9d" opacity="0.8"/>
  <text x="690" y="20" fill="#71717a" font-size="9">WiFi / Real-time</text>
</svg>
